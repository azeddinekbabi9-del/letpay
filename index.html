<!DOCTYPE html>
<html lang="ar" dir="rtl">

    .download {

      border-radius: 12px;
      background: #19df52;
      color: #010803;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .download:hover { background: #60f289; }
